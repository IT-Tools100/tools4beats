[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "verse"
version = "0.1.0"
description = "Project Verse — desktop CRM for a beatmaker"
requires-python = ">=3.12"
dependencies = [
    "PySide6-Essentials==6.12.0",
    "SQLAlchemy[asyncio]==2.1.6",
    "greenlet==3.5.6",
    "psycopg[binary]==3.3.6",
    "alembic==1.20.1",
    "pydantic==2.14.2",
    "pydantic-settings==2.16.2",
    "httpx==0.28.1",
    "keyring==25.7.0",
    "openpyxl==3.1.5",
    "python-dotenv==1.2.4",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1",
    "pytest-qt==4.5.0",
    "respx==0.23.1",
]

[project.scripts]
verse = "verse.app:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
verse = ["ui/assets/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 110
target-version = "py312"
