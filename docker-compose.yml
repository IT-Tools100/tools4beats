services:
  db:
    image: postgres:17-alpine
    container_name: verse-postgres
    environment:
      POSTGRES_USER: verse
      POSTGRES_PASSWORD: verse
      POSTGRES_DB: verse
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - verse_pgdata:/var/lib/postgresql/data
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U verse -d verse"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  verse_pgdata:
